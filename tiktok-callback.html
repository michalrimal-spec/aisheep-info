<h1>TikTok authorization</h1>
<p>This page only displays the result of the authorization of the owner's own TikTok account.
It stores and sends nothing. The owner copies the code below into the aisheep command line.</p>
<pre id="out">Waiting&hellip;</pre>
<script>
var q=new URLSearchParams(location.search),o=document.getElementById('out');
o.textContent=q.get('code')?('code: '+q.get('code')+'\nstate: '+(q.get('state')||'')):('error: '+(q.get('error')||'no code')+' '+(q.get('error_description')||''));
</script>
